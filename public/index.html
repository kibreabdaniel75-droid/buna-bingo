
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buna Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
    --bg-dark:#121212;
    --bg-panel:#1e1e1e;
    --gold:#FFD700;
    --gold-dark:#DAA520;
    --text-light:#fff;
    --text-muted:#a0a0a0;
    --purple-btn:#6c5ce7;
    --green:#27ae60;
    --red:#e74c3c;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body {
    background:var(--bg-dark);
    color:var(--text-light);
    display:flex;
    justify-content:center;
}

.app-container {
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    background:var(--bg-dark);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:linear-gradient(90deg,#111,#333);
    border-bottom:2px solid var(--gold);
}

.header-title {
    font-size:20px;
    font-weight:bold;
    color:var(--gold);
}

#player-name {
    font-size:12px;
    font-weight:bold;
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.info-bar {
    display:flex;
    justify-content:space-between;
    padding:10px 15px;
    background:var(--bg-panel);
    font-size:12px;
    color:var(--text-muted);
    border-bottom:1px solid #333;
}

.highlight {
    color:var(--gold);
    font-weight:bold;
}

.tabs {
    display:flex;
    background:var(--bg-panel);
    margin:10px 15px;
    border-radius:8px;
    overflow:hidden;
    border:1px solid #333;
}

.tab {
    flex:1;
    text-align:center;
    padding:10px 5px;
    font-size:13px;
    color:var(--text-muted);
}

.tab.active {
    background:var(--gold);
    color:#000;
    font-weight:bold;
}

.summary-cards {
    display:flex;
    justify-content:space-between;
    padding:0 15px;
    gap:8px;
    margin-bottom:10px;
}

.summary-card {
    flex:1;
    min-width:0;
    background:var(--bg-panel);
    border:1px solid #333;
    border-radius:10px;
    padding:9px 6px;
    display:flex;
    align-items:center;
    gap:6px;
}

.summary-icon {
    width:27px;
    height:27px;
    flex-shrink:0;
    border-radius:5px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
}

.icon-balance {background:#333;color:var(--gold);}
.icon-bonus {background:#4a3b00;color:var(--gold);}
.icon-time {background:#4a1a00;color:#ff6b6b;}

.summary-text {
    display:flex;
    flex-direction:column;
    min-width:0;
}

.summary-title {
    font-size:9px;
    color:var(--text-muted);
    text-transform:uppercase;
}

.summary-value {
    font-size:12px;
    font-weight:bold;
    color:var(--gold);
    overflow:hidden;
    text-overflow:ellipsis;
}

.grid-header {
    display:flex;
    justify-content:space-between;
    padding:0 15px 10px;
    font-size:13px;
    color:var(--gold);
    font-weight:bold;
}

.grid-container {
    flex:1;
    overflow-y:auto;
    padding:0 15px 15px;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:4px;
    align-content:start;
}

.grid-container::-webkit-scrollbar {width:6px;}
.grid-container::-webkit-scrollbar-thumb {
    background:var(--gold-dark);
    border-radius:3px;
}

.card-number {
    background:var(--bg-panel);
    border:1px solid #444;
    border-radius:4px;
    aspect-ratio:1;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:10px;
    color:white;
    cursor:pointer;
}

.card-number.selected {
    background:var(--gold);
    color:#000;
    font-weight:bold;
    border-color:var(--gold);
}

.card-number.reserved {
    background:#383838;
    color:#777;
    border-color:#333;
    cursor:not-allowed;
    opacity:.65;
}

.card-number.owned {
    background:var(--green);
    color:white;
    border-color:var(--green);
    cursor:not-allowed;
}

.bottom-area {
    background:var(--bg-panel);
    border-top:1px solid #333;
    padding:12px 15px;
    border-radius:20px 20px 0 0;
    box-shadow:0 -5px 15px rgba(0,0,0,.5);
    z-index:10;
}

.reserve-section {
    display:flex;
    align-items:center;
    margin-bottom:12px;
    gap:15px;
}

.btn-reserve {
    background:var(--purple-btn);
    color:white;
    border:none;
    padding:11px 25px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
}

.btn-reserve:disabled {
    opacity:.5;
    cursor:not-allowed;
}

.selected-text {
    font-size:13px;
    color:var(--text-muted);
}

.my-cards-header {
    font-size:15px;
    font-weight:bold;
    color:var(--gold);
    margin-bottom:9px;
}

.btn-refresh {
    width:100%;
    background:var(--gold);
    color:#000;
    border:none;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.toast {
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#f39c12;
    color:#000;
    padding:14px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
    text-align:center;
    z-index:100;
    display:none;
    width:90%;
    max-width:400px;
}

.toast.show {display:block;}
.toast.success {background:var(--green);color:white;}
.toast.error {background:var(--red);color:white;}
</style>
</head>

<body>
<div class="app-container">

    <div class="header">
        <div class="header-title">Buna Bingo</div>
        <div id="player-name">Connecting...</div>
    </div>

    <div class="info-bar">
        <div>Room <span class="highlight" id="room-status">Loading</span></div>
        <div>Pool <span class="highlight" id="prize-pool">—</span></div>
        <div>Stake <span class="highlight">10 ETB</span></div>
    </div>

    <div class="tabs">
        <div class="tab active">Cards</div>
        <div class="tab">History</div>
        <div class="tab">How to play</div>
    </div>

    <div class="summary-cards">
        <div class="summary-card">
            <div class="summary-icon icon-balance">💳</div>
            <div class="summary-text">
                <span class="summary-title">Balance</span>
                <span class="summary-value" id="main-balance">—</span>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-icon icon-bonus">🎁</div>
            <div class="summary-text">
                <span class="summary-title">Bonus</span>
                <span class="summary-value" id="bonus-balance">—</span>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-icon icon-time">⏳</div>
            <div class="summary-text">
                <span class="summary-title">Time Left</span>
                <span class="summary-value" id="time-left">—</span>
            </div>
        </div>
    </div>

    <div class="grid-header">
        <span>⊞ 500 cards · 25x20</span>
        <span style="font-weight:normal;color:var(--text-muted);font-size:11px">
            Tap to select
        </span>
    </div>

    <div class="grid-container" id="cards-grid"></div>

    <div class="bottom-area">
        <div class="reserve-section">
            <button class="btn-reserve" id="reserve-button">
                🔒 Reserve
            </button>

            <span class="selected-text">
                Selected: <span id="selected-count">0</span>
            </span>
        </div>

        <div class="my-cards-header">
            ⊞ My cards (<span id="my-cards-counter">0</span>/4)
        </div>

        <button class="btn-refresh" id="refresh-button">
            🔄 Refresh
        </button>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
const playerName = document.getElementById("player-name");
const mainBalance = document.getElementById("main-balance");
const bonusBalance = document.getElementById("bonus-balance");
const prizePool = document.getElementById("prize-pool");
const roomStatus = document.getElementById("room-status");
const timeLeft = document.getElementById("time-left");
const grid = document.getElementById("cards-grid");
const selectedDisplay = document.getElementById("selected-count");
const myCardsCounter = document.getElementById("my-cards-counter");
const reserveButton = document.getElementById("reserve-button");

const MAX_CARDS = 4;

let tg = null;
let selectedCards = new Set();
let myCards = new Set();
let reservedCards = new Set();
let player = null;
let roomData = null;
let busy = false;
let countdownTimer = null;
let refreshTimer = null;

function showToast(message, type = "error") {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.className = "toast show " + type;

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.className = "toast";
    }, 3500);

    if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred(
            type === "success" ? "success" : "error"
        );
    }
}

function formatMoney(value) {
    return Number(value || 0).toFixed(2) + " ETB";
}

function updateSelectedDisplay() {
    selectedDisplay.textContent = selectedCards.size;
    myCardsCounter.textContent = myCards.size;
}

function renderCard(cardNumber) {
    const card = document.getElementById("card-" + cardNumber);
    if (!card) return;

    card.className = "card-number";
    card.disabled = false;

    if (myCards.has(cardNumber)) {
        card.classList.add("owned");
        card.disabled = true;
    } else if (reservedCards.has(cardNumber)) {
        card.classList.add("reserved");
        card.disabled = true;
    } else if (selectedCards.has(cardNumber)) {
        card.classList.add("selected");
    }
}

function createCards() {
    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= 500; i++) {
        const card = document.createElement("button");

        card.type = "button";
        card.id = "card-" + i;
        card.className = "card-number";
        card.textContent = i;

        card.addEventListener("click", () => {
            if (busy || reservedCards.has(i) || myCards.has(i)) return;

            if (selectedCards.has(i)) {
                selectedCards.delete(i);
            } else {
                if (selectedCards.size + myCards.size >= MAX_CARDS) {
                    showToast("You can select a maximum of 4 cards.");
                    return;
                }
                selectedCards.add(i);
            }

            renderCard(i);
            updateSelectedDisplay();
        });

        fragment.appendChild(card);
    }

    grid.appendChild(fragment);
}

function updateBalances(data) {
    if (!data) return;
    mainBalance.textContent = formatMoney(data.main_balance);
    bonusBalance.textContent = formatMoney(data.bonus_balance);
}

async function authenticate() {
    // Wait briefly for the external Telegram SDK to initialize.
    for (let i = 0; i < 20; i++) {
        if (window.Telegram?.WebApp) break;
        await new Promise(resolve => setTimeout(resolve, 250));
    }

    tg = window.Telegram?.WebApp || null;

    if (!tg) {
        playerName.textContent = "SDK not loaded";
        showToast("Telegram SDK did not load. Please reopen the game.");
        console.error("SDK missing. Check the Telegram Web App script.");
        return false;
    }

    tg.ready();
    tg.expand();

    if (!tg.initData) {
        playerName.textContent = "Open in Telegram";
        showToast("No Telegram login data. Open this game using the bot.");
        console.error("Telegram SDK loaded, but initData is empty.");
        return false;
    }

    try {
        const response = await fetch("/api/auth/telegram", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                initData: tg.initData
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.player) {
            throw new Error(data.error || "Telegram login failed.");
        }

        player = data.player;

        const fullName = [
            player.first_name,
            player.last_name
        ].filter(Boolean).join(" ");

        playerName.textContent =
            fullName ||
            (tg.initDataUnsafe?.user?.username
                ? "@" + tg.initDataUnsafe.user.username
                : "Player");

        updateBalances(player);
        return true;

    } catch (error) {
        playerName.textContent = "Login failed";
        showToast(error.message);
        console.error("AUTH ERROR:", error);
        return false;
    }
}

async function loadRoom() {
    try {
        const response = await fetch("/api/room", {
            method: "GET",
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Could not load Bingo room.");
        }

        roomData = data.room;
        reservedCards = new Set(
            (data.reservedCards || []).map(Number)
        );

        prizePool.textContent = formatMoney(roomData.prizePool);

        roomStatus.textContent =
            roomData.status === "waiting" ? "Waiting" :
            roomData.status === "countdown" ? "Countdown" :
            roomData.status === "ready" ? "Ready" :
            roomData.status;

        for (let i = 1; i <= 500; i++) {
            renderCard(i);
        }

        updateSelectedDisplay();
        updateCountdown();

        reserveButton.disabled =
            busy ||
            (roomData.status !== "waiting" &&
             roomData.status !== "countdown");

        return true;

    } catch (error) {
        console.error("ROOM LOAD ERROR:", error);
        showToast(error.message);
        return false;
    }
}

function updateCountdown() {
    clearInterval(countdownTimer);

    function tick() {
        if (!roomData) {
            timeLeft.textContent = "—";
            return;
        }

        if (roomData.status === "countdown" &&
            roomData.countdownEndsAt) {

            const remaining = Math.max(
                0,
                Math.ceil((roomData.countdownEndsAt - Date.now()) / 1000)
            );

            timeLeft.textContent = remaining + "s";

            if (remaining === 0) {
                roomStatus.textContent = "Ready";
                reserveButton.disabled = true;
            }

        } else if (roomData.status === "waiting") {
            timeLeft.textContent = "Waiting";
        } else {
            timeLeft.textContent = "—";
        }
    }

    tick();
    countdownTimer = setInterval(tick, 1000);
}

async function reserveCards() {
    if (busy) return;

    if (!player || !tg?.initData) {
        showToast("Please wait for Telegram login.");
        return;
    }

    if (selectedCards.size < 1) {
        showToast("Please select at least one card.");
        return;
    }

    if (selectedCards.size + myCards.size > MAX_CARDS) {
        showToast("You can reserve a maximum of 4 cards.");
        return;
    }

    const cards = [...selectedCards];

    busy = true;
    reserveButton.disabled = true;
    reserveButton.textContent = "Reserving...";

    try {
        const response = await fetch("/api/room/reserve", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                initData: tg.initData,
                cards: cards
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Reservation failed.");
        }

        cards.forEach(card => {
            myCards.add(card);
            selectedCards.delete(card);
            reservedCards.add(card);
        });

        if (data.mainBalance !== undefined) {
            mainBalance.textContent = formatMoney(data.mainBalance);
        }

        if (data.bonusBalance !== undefined) {
            bonusBalance.textContent = formatMoney(data.bonusBalance);
        }

        if (data.room) roomData = data.room;

        for (let i = 1; i <= 500; i++) {
            renderCard(i);
        }

        updateSelectedDisplay();

        showToast(
            "Successfully reserved " + cards.length +
            " card(s)! Charged " + formatMoney(data.charged) + ".",
            "success"
        );

        await loadRoom();

    } catch (error) {
        showToast(error.message);
        await loadRoom();

    } finally {
        busy = false;
        reserveButton.textContent = "🔒 Reserve";

        reserveButton.disabled =
            !roomData ||
            (roomData.status !== "waiting" &&
             roomData.status !== "countdown");
    }
}

async function refreshApp() {
    if (busy) return;

    const authenticated = await authenticate();

    if (authenticated) await loadRoom();
}

document.getElementById("reserve-button")
    .addEventListener("click", reserveCards);

document.getElementById("refresh-button")
    .addEventListener("click", refreshApp);

async function startApp() {
    createCards();

    const authenticated = await authenticate();

    if (authenticated) {
        await loadRoom();

        refreshTimer = setInterval(() => {
            if (!busy) loadRoom();
        }, 5000);
    }
}

startApp();
</script>
</body>
</html>
